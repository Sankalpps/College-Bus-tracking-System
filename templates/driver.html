<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Campus BusTrack – Driver Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/static/css/driver.css"/>
<script src="/static/js/socket.io.min.js"></script>
</head>
<body>

<header class="topbar">
  <div class="topbar-brand">
    <span class="brand-icon">🚌</span>
    <span class="brand-name">CampusBus<em>Track</em></span>
  </div>
  <nav class="topbar-nav">
    <span class="nav-link active">Driver Panel</span>
    <a href="/logout" class="nav-link" style="color: var(--amber);">Logout</a>
  </nav>
  <div class="topbar-status">
    <span class="dot" id="conn-dot"></span>
    <span id="conn-label">Connecting…</span>
  </div>
</header>

<main class="driver-main">

  <!-- Bus selector -->
  <section class="card bus-select-card">
    <h2 class="card-title">Select Your Bus</h2>
    <div class="select-wrap">
      <select id="bus-select" class="styled-select">
        <option value="">-- Choose a bus --</option>
      </select>
    </div>
    <div class="bus-info" id="bus-info" style="display:none">
      <div class="info-row"><span class="info-label">Route</span><span id="info-route">–</span></div>
      <div class="info-row"><span class="info-label">Plate</span><span id="info-plate">–</span></div>
      <div class="info-row"><span class="info-label">Capacity</span><span id="info-cap">–</span></div>
    </div>
  </section>

  <!-- Trip control -->
  <section class="card trip-card">
    <h2 class="card-title">Trip Control</h2>

    <div class="trip-status-row">
      <div class="status-badge" id="trip-badge">NOT STARTED</div>
    </div>

    <div class="btn-group">
      <button class="btn btn-start" id="btn-start" disabled>
        <span class="btn-icon">▶</span> Start Trip
      </button>
      <button class="btn btn-stop"  id="btn-stop"  disabled>
        <span class="btn-icon">■</span> Stop Trip
      </button>
      <button class="btn btn-simulate" id="btn-simulate" disabled style="background: rgba(245,166,35,0.1); color: var(--amber); border: 1px solid var(--amber); margin-top: 10px; width: 100%;">
        <span class="btn-icon">🔄</span> Simulate Route
      </button>
    </div>
  </section>

  <!-- GPS status -->
  <section class="card gps-card">
    <h2 class="card-title">GPS Status</h2>
    <div class="gps-grid">
      <div class="gps-item">
        <div class="gps-label">LATITUDE</div>
        <div class="gps-value mono" id="gps-lat">–</div>
      </div>
      <div class="gps-item">
        <div class="gps-label">LONGITUDE</div>
        <div class="gps-value mono" id="gps-lon">–</div>
      </div>
      <div class="gps-item">
        <div class="gps-label">ACCURACY</div>
        <div class="gps-value mono" id="gps-acc">–</div>
      </div>
      <div class="gps-item">
        <div class="gps-label">LAST PING</div>
        <div class="gps-value mono" id="gps-ts">–</div>
      </div>
    </div>
    <div class="gps-bar">
      <div class="gps-bar-fill" id="gps-bar-fill"></div>
    </div>
    <div class="gps-msg" id="gps-msg">GPS inactive</div>
  </section>

  <!-- Activity log -->
  <section class="card log-card">
    <h2 class="card-title">Activity Log</h2>
    <ul class="log-list" id="log-list">
      <li class="log-item muted">Waiting…</li>
    </ul>
  </section>

</main>

<script src="/static/js/driver.js"></script>
</body>
</html>
